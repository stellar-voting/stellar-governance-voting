[package]
name = "stellar-governance-voting-backend"
version = "0.2.0"
edition = "2021"
description = "REST API for the Stellar governance voting protocol"
license = "MIT"
default-run = "stellar-governance-voting-backend"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lib]
name = "stellar_governance_voting_backend"
path = "src/lib.rs"

[[bin]]
name = "stellar-governance-voting-backend"
path = "src/main.rs"
